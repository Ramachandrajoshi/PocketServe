[versions]
compileSdk             = "35"
minSdk                 = "28"
targetSdk              = "35"
kotlin                 = "1.9.22"
agp                    = "8.3.0"
hilt                   = "2.51"
ksp                    = "1.9.22-1.0.17"
compose-bom            = "2024.02.02"
lifecycle              = "2.7.0"
navigation             = "2.7.7"
room                   = "2.6.1"
datastore              = "1.0.0"
ktor                   = "2.3.9"
work                   = "2.9.0"
media3                 = "1.3.0"
okhttp                 = "4.12.0"
retrofit               = "2.11.0"
moshi                  = "1.15.1"
coil                   = "2.6.0"
mpandroidchart         = "3.1.0"
litert                 = "1.0.0"
mediapipe-tasks        = "0.10.14"
timber                 = "5.0.1"
coroutines             = "1.8.0"

[libraries]
# Compose
compose-bom                  = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling           = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons       = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-activity             = { group = "androidx.activity", name = "activity-compose", version = "1.8.2" }
compose-navigation           = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
compose-hilt-navigation      = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }
lifecycle-viewmodel-ktx      = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Hilt
hilt-android                 = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-work                    = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }

# Inference Backends
mediapipe-llm                = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipe-tasks" }

# Coroutines
coroutines-android           = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
